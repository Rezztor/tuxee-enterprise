name: Release

# Push a vMAJOR.MINOR.PATCH tag to publish tuxee-linux-amd64 and checksums.txt, which install.sh downloads.
# Pull requests run the same build and tests without publishing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: write

concurrency:
  group: tuxee-release
  cancel-in-progress: false

jobs:
  release:
    # GitHub's runner. 22.04 for an older glibc (2.35), so the binary runs on more customer systems.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build frontend and guardian
        run: |
          sudo apt-get update && sudo apt-get install -y libpam0g-dev musl-tools
          npm ci
          npm run build
          make -C internal/keeper/native
      - name: Test
        run: go test ./internal/update ./internal/server ./cmd/tuxee
      - name: Build
        run: |
          mkdir -p release
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X main.version=${TAG#v}" -o release/tuxee-linux-amd64 ./cmd/tuxee
          test "$(release/tuxee-linux-amd64 version)" = "Tuxee ${TAG#v}"
          (cd release && sha256sum tuxee-linux-amd64 > checksums.txt)
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$TAG" release/* --title "Tuxee Enterprise $TAG" --generate-notes --verify-tag
